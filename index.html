<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14173A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lantern Breaker">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Lantern Breaker</title>
<style>
  :root { --night:#14173A; --edge:#2A2F6B; --ink:#F6F1FF; --dim:#A9AEE0; --saffron:#FF9F1C; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    height:100%; background:var(--night); color:var(--ink); overflow:hidden;
    font-family: ui-rounded, "SF Pro Rounded", Nunito, "Segoe UI", system-ui, sans-serif;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
  }
  #stage {
    position:fixed; inset:0; height:100dvh; display:grid; place-items:center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  canvas { display:block; touch-action:none; border-radius:16px; box-shadow:0 0 0 2px var(--edge); }
  .overlay {
    position:fixed; inset:0; display:grid; place-items:center; text-align:center; padding:24px;
    background:rgba(20,23,58,.84);
  }
  .overlay[hidden] { display:none; }
  .panel { max-width:21rem; }
  h1 { font-size:clamp(2.2rem, 10vw, 3.4rem); line-height:.95; letter-spacing:-.03em; margin-bottom:.75rem; }
  h2 { font-size:2rem; letter-spacing:-.02em; margin-bottom:.5rem; }
  p { color:var(--dim); line-height:1.5; margin:.25rem 0 1.5rem; }
  .row { display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap; }
  button {
    font:inherit; font-weight:700; font-size:1.1rem; padding:.85rem 1.9rem; border:0; border-radius:999px;
    background:var(--saffron); color:#2B1500; cursor:pointer;
  }
  button.ghost { background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px var(--edge); }
  button:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  .hint { font-size:.9rem; margin:1.25rem 0 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="game" aria-label="Lantern Breaker game"></canvas></div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>Lantern<br>Breaker</h1>
    <p>Bounce the ball and light up every lantern.<br>Best score: <span id="bestMenu">0</span></p>
    <button id="playBtn">Play</button>
    <p class="hint" id="controlsHint">Drag to move the paddle, tap to launch.</p>
    <p class="hint" id="iosHint" hidden>For full screen on iPhone, tap Share, then Add to Home Screen.</p>
  </div>
</div>

<div class="overlay" id="pauseMenu" hidden>
  <div class="panel">
    <h2>Paused</h2>
    <p>Your game is waiting.</p>
    <div class="row">
      <button id="resumeBtn">Resume</button>
      <button id="restartBtn" class="ghost">Restart</button>
    </div>
  </div>
</div>

<div class="overlay" id="overMenu" hidden>
  <div class="panel">
    <h2>Game over</h2>
    <p>Score: <span id="finalScore">0</span><br>Best: <span id="bestOver">0</span></p>
    <button id="againBtn">Play again</button>
  </div>
</div>

<script>
// ---------- Setup & responsive scaling ----------
const W = 480, HUD = 56;                        // logical width stays fixed; height follows the screen
let H = 720;                                    // recomputed in fit()
const H_MIN = 720, H_MAX = 1100;                // clamp, so very tall or short screens stay reasonable
let layoutReady = false;                        // true once paddle/ball exist and fit() may move them
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const stage = document.getElementById('stage');

function fit() {
  const cs = getComputedStyle(stage);
  const aw = stage.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = stage.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom);

  // Match the logical height to the stage's aspect ratio so tall phones fill the
  // screen instead of showing empty bands. Wide screens compute well below H_MIN
  // and clamp to 720, so desktop keeps the centred 480x720 board it has today.
  H = aw > 0 ? Math.max(H_MIN, Math.min(H_MAX, Math.round(W * ah / aw))) : H_MIN;

  const scale = Math.min(aw / W, ah / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);   // cap for performance
  cvs.style.width  = W * scale + 'px';
  cvs.style.height = H * scale + 'px';
  cvs.width  = Math.round(W * scale * dpr);
  cvs.height = Math.round(H * scale * dpr);
  ctx.setTransform(cvs.width / W, 0, 0, cvs.height / H, 0, 0);

  // A resize mid-game (rotation, fullscreen) must not reset the level or score:
  // just re-anchor the paddle to the new floor and carry a stuck ball with it.
  if (layoutReady) {
    paddle.y = H - 64;
    if (ball.stuck) { ball.x = paddle.x; ball.y = paddle.y - paddle.h / 2 - ball.r - 1; }
  }
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 150));
fit();

// ---------- Sound (generated, no audio files) ----------
let actx = null;
function unlockAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
}
function beep(freq, dur = 0.06, type = 'square', vol = 0.07) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur);
}

// ---------- Game state ----------
const COLORS = ['#FF5D73', '#FF9F1C', '#FFD23F', '#3BCEAC', '#5AA9E6', '#C77DFF'];
const COLS = 8, ROWS = 6, PAD = 24, GAP = 6, BH = 20, TOP = HUD + 40;
const BW = (W - PAD * 2 - GAP * (COLS - 1)) / COLS;

const paddle = { w: 96, h: 14, x: W / 2, y: H - 64, speed: 640 };   // H is already final: fit() ran above
const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, stuck: true };
layoutReady = true;                             // from here on, fit() can reposition the paddle and ball
let bricks = [], sparks = [];
let score = 0, lives = 3, level = 1, best = 0;
let state = 'menu';                 // menu | play | paused | over
let pointerX = null;
const keys = { left: false, right: false };
let message = '', messageTime = 0;

try { best = Number(localStorage.getItem('lantern-best')) || 0; } catch (e) {}

function buildLevel() {
  bricks = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({ x: PAD + c * (BW + GAP), y: TOP + r * (BH + GAP), alive: true, color: COLORS[r], pts: (ROWS - r) * 10 });
}
const ballSpeed = () => 340 * Math.pow(1.08, level - 1);

function resetBall() {
  ball.stuck = true; ball.vx = ball.vy = 0;
  ball.x = paddle.x; ball.y = paddle.y - paddle.h / 2 - ball.r - 1;
}
function launch() {
  if (!ball.stuck) return;
  const s = ballSpeed(), a = -Math.PI / 2 + (Math.random() * 0.6 - 0.3);
  ball.vx = Math.cos(a) * s; ball.vy = Math.sin(a) * s; ball.stuck = false;
  beep(660);
}
function flash(text, secs = 1.6) { message = text; messageTime = secs; }

function newGame() {
  score = 0; lives = 3; level = 1; paddle.x = W / 2; sparks = [];
  buildLevel(); resetBall(); state = 'play';
  flash(matchMedia('(pointer: coarse)').matches ? 'Tap to launch' : 'Click or press Space');
}

function gameOver() {
  state = 'over';
  if (score > best) { best = score; try { localStorage.setItem('lantern-best', best); } catch (e) {} }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('bestOver').textContent = best;
  show('overMenu');
  beep(120, 0.5, 'sawtooth');
}

// ---------- Update ----------
function update(dt) {
  if (pointerX !== null) paddle.x += (pointerX - paddle.x) * Math.min(1, dt * 25);
  if (keys.left)  paddle.x -= paddle.speed * dt;
  if (keys.right) paddle.x += paddle.speed * dt;
  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

  if (ball.stuck) { ball.x = paddle.x; ball.y = paddle.y - paddle.h / 2 - ball.r - 1; return; }

  // Small sub-steps so a fast ball never tunnels through bricks
  const steps = Math.max(1, Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 6));
  for (let i = 0; i < steps; i++) if (step(dt / steps)) break;
}

function step(h) {
  ball.x += ball.vx * h; ball.y += ball.vy * h;

  // Walls & ceiling
  if (ball.x < ball.r)          { ball.x = ball.r;         ball.vx =  Math.abs(ball.vx); beep(300, .03); }
  if (ball.x > W - ball.r)      { ball.x = W - ball.r;     ball.vx = -Math.abs(ball.vx); beep(300, .03); }
  if (ball.y < HUD + ball.r)    { ball.y = HUD + ball.r;   ball.vy =  Math.abs(ball.vy); beep(300, .03); }

  // Paddle: hit position decides bounce angle
  const px = paddle.x - paddle.w / 2, py = paddle.y - paddle.h / 2;
  if (ball.vy > 0 && ball.y + ball.r >= py && ball.y - ball.r <= py + paddle.h &&
      ball.x >= px - ball.r && ball.x <= px + paddle.w + ball.r) {
    const t = Math.max(-1, Math.min(1, (ball.x - paddle.x) / (paddle.w / 2)));
    const a = -Math.PI / 2 + t * 1.05, s = Math.hypot(ball.vx, ball.vy);
    ball.vx = Math.cos(a) * s; ball.vy = Math.sin(a) * s; ball.y = py - ball.r;
    beep(440, .05);
  }

  // Bricks (circle vs rectangle)
  for (const b of bricks) {
    if (!b.alive) continue;
    const cx = Math.max(b.x, Math.min(ball.x, b.x + BW));
    const cy = Math.max(b.y, Math.min(ball.y, b.y + BH));
    const dx = ball.x - cx, dy = ball.y - cy;
    if (dx * dx + dy * dy > ball.r * ball.r) continue;

    b.alive = false; score += b.pts;
    burst(b.x + BW / 2, b.y + BH / 2, b.color);
    if (dx === 0 && dy === 0)              ball.vy = -ball.vy;
    else if (Math.abs(dx) > Math.abs(dy))  ball.vx = dx > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
    else                                   ball.vy = dy > 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
    beep(500 + (b.pts * 6), .05, 'triangle');

    if (bricks.every(k => !k.alive)) {
      level++; buildLevel(); resetBall();
      flash('Level ' + level); beep(880, .25, 'triangle');
    }
    return true;
  }

  // Missed the ball
  if (ball.y - ball.r > H) {
    lives--;
    if (lives <= 0) { gameOver(); return true; }
    resetBall(); flash(lives + (lives === 1 ? ' life left' : ' lives left'));
    beep(160, .3, 'sawtooth');
    return true;
  }
  return false;
}

// ---------- Effects ----------
function burst(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5, color });
  }
}
function updateFx(dt) {
  for (const p of sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; }
  sparks = sparks.filter(p => p.life > 0);
  if (messageTime > 0) messageTime -= dt;
}

// ---------- Drawing ----------
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}
const FONT = 'ui-rounded, "SF Pro Rounded", Nunito, system-ui, sans-serif';

function draw() {
  ctx.fillStyle = '#14173A'; ctx.fillRect(0, 0, W, H);

  // HUD
  ctx.fillStyle = '#1C2050'; ctx.fillRect(0, 0, W, HUD);
  ctx.textBaseline = 'middle'; ctx.font = `700 22px ${FONT}`;
  ctx.fillStyle = '#F6F1FF'; ctx.textAlign = 'left';   ctx.fillText(score, 20, HUD / 2);
  ctx.fillStyle = '#A9AEE0'; ctx.textAlign = 'center'; ctx.font = `600 16px ${FONT}`;
  ctx.fillText('Level ' + level, W / 2, HUD / 2);
  for (let i = 0; i < lives; i++) {
    ctx.fillStyle = '#FF5D73'; ctx.beginPath();
    ctx.arc(W - 78 - i * 18, HUD / 2, 5, 0, Math.PI * 2); ctx.fill();
  }
  // pause icon (tap target: top-right corner)
  ctx.fillStyle = '#F6F1FF';
  ctx.fillRect(W - 36, HUD / 2 - 9, 5, 18); ctx.fillRect(W - 26, HUD / 2 - 9, 5, 18);

  // Lantern bricks
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.color; rrect(b.x, b.y, BW, BH, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.28)'; rrect(b.x + 4, b.y + 3, BW - 8, 4, 2); ctx.fill();
  }

  // Sparks
  for (const p of sparks) {
    ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // Paddle & ball
  ctx.fillStyle = '#F6F1FF';
  rrect(paddle.x - paddle.w / 2, paddle.y - paddle.h / 2, paddle.w, paddle.h, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();

  // Message
  if (messageTime > 0 && state === 'play') {
    ctx.globalAlpha = Math.min(1, messageTime * 2);
    ctx.fillStyle = '#F6F1FF'; ctx.textAlign = 'center'; ctx.font = `700 26px ${FONT}`;
    ctx.fillText(message, W / 2, H * 0.62);
    ctx.globalAlpha = 1;
  }
}

// ---------- Main loop ----------
let last = performance.now();
function frame(t) {
  const dt = Math.min((t - last) / 1000, 1 / 30);
  last = t;
  if (state === 'play') update(dt);
  updateFx(dt);
  draw();
  requestAnimationFrame(frame);
}

// ---------- Input: pointer (mouse + touch + pen) ----------
function toLogical(e) {
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cvs.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const p = toLogical(e);
  if (p.y < HUD && p.x > W - 64) { pause(); return; }
  pointerX = p.x;
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  launch();
});
cvs.addEventListener('pointermove', e => { if (state === 'play') pointerX = toLogical(e).x; });

// ---------- Input: keyboard ----------
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a') { keys.left = true;  pointerX = null; }
  if (e.key === 'ArrowRight' || e.key === 'd') { keys.right = true; pointerX = null; }
  if (e.key === ' ') { e.preventDefault(); if (state === 'play') launch(); }
  if (e.key === 'p' || e.key === 'Escape') { state === 'play' ? pause() : state === 'paused' && resume(); }
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

// ---------- Menus, pause, fullscreen ----------
const overlays = ['menu', 'pauseMenu', 'overMenu'];
function show(id) { overlays.forEach(o => document.getElementById(o).hidden = o !== id); }
function hideAll() { overlays.forEach(o => document.getElementById(o).hidden = true); }

function pause()  { if (state !== 'play') return; state = 'paused'; keys.left = keys.right = false; show('pauseMenu'); }
function resume() { state = 'play'; hideAll(); last = performance.now(); }

const isStandalone = () =>
  matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone === true;

function goFullscreen() {
  if (isStandalone()) return;                      // already app-like when installed
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;                                // iPhone Safari: not supported
  Promise.resolve(req.call(el)).then(() => {
    screen.orientation?.lock?.('portrait').catch(() => {});
  }).catch(() => {});
}

function start() { unlockAudio(); goFullscreen(); hideAll(); newGame(); }
document.getElementById('playBtn').onclick    = start;
document.getElementById('againBtn').onclick   = start;
document.getElementById('restartBtn').onclick = () => { hideAll(); newGame(); };
document.getElementById('resumeBtn').onclick  = resume;

// Auto-pause when the app goes to the background
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
document.addEventListener('fullscreenchange', () => setTimeout(fit, 100));

// Menu text per device
document.getElementById('bestMenu').textContent = best;
if (!matchMedia('(pointer: coarse)').matches)
  document.getElementById('controlsHint').textContent = 'Mouse or arrow keys to move, click or Space to launch, P to pause.';
if (/iPhone|iPod/.test(navigator.userAgent) && !isStandalone())
  document.getElementById('iosHint').hidden = false;

// Backdrop behind the menu
buildLevel(); resetBall();
requestAnimationFrame(frame);

// ---------- PWA: offline support ----------
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
